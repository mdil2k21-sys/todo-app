<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- Header -->
        <header class="app-header">
            <div>
                <a href="https://portofolio-08do.netlify.app" class="back-link">← Portfolio</a>
                <h1 class="app-title">Tasks</h1>
            </div>
            <span class="task-count" id="taskCount">0 tasks</span>
        </header>

        <!-- Form Input -->
        <form id="todoForm" class="todo-form">
            <input
                type="text"
                id="todoInput"
                placeholder="Tambah task baru..."
                autocomplete="off"
            >
            <button type="submit" aria-label="Tambah task">+</button>
        </form>

        <!-- Filter tabs -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="active">Aktif</button>
            <button class="filter-btn" data-filter="completed">Selesai</button>
            <button id="clearCompleted" class="clear-btn">Hapus selesai</button>
        </div>

        <!-- Task List -->
        <ul id="todoList" class="todo-list">
            <!-- Diisi JavaScript -->
        </ul>

    </div>

    <script src="script.js"></script>
</body>
</html>
